[package]
name = "dropchad"
version = "0.1.0"
description = "dropchad merkle drops on Solana. docs/SPEC-SOLANA.md is the source of truth."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dropchad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Pinned to the version the lock builds, audit info 10. From round F2 built with platform tools
# v1.57 and `--arch v3`, SBPF v3, docs/SPEC-SOLANA.md S14.18.
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = "=1.2.0"
# keccak: the sol_keccak256 syscall on chain, sha3 off chain for the tests. Same crate anchor pulls in.
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
# the safe #[account(zero_copy)] derive expands to ::bytemuck::Pod, so the crate must be a direct dependency
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }
# S7.22: the instructions sysvar reader and the Ed25519 program id. Already in Cargo.lock
# through anchor-lang; anchor-lang 1.2 does not re-export them.
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
# precompiles: LiteSVM runs the Ed25519 signature check only with this on, S7.22. Tests only.
# 0.18.1 loads SBPF v3, 0.10 cannot; the message and transaction crates follow its 4.x line, and
# `wincode` is what turns on `try_new` and `serialize` there. Section 15.
litesvm = { version = "0.18.1", features = ["precompiles"] }
solana-message = "4.2.4"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
# the Rent the harness sets, the same crate line LiteSVM 0.18 uses, so it is the same type
solana-rent = "~4.4.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
base64 = "0.22"
sha3 = "0.10"
proptest = "1"
