# gitleaks: the default rules, plus the known test values that look like secrets and are not.
[extend]
useDefault = true

[allowlist]
description = "Public test values, never secrets"
regexes = [
  # Anvil's well known accounts 0, 1 and 2: public test keys that never hold value.
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  # A Solana public key in a test, not a private key.
  '''GWuNAEF8WBr94qytoN6pK9VSPPa3g3w5SamK43oJNXzP''',
  # A token contract address on Robinhood Chain, public.
  '''0x020bfC650A365f8BB26819deAAbF3E21291018b4''',
  # Plain numeric defaults in .env.example.
  '''HANDLE_MAX_RECEIVERS=500''',
  '''PRICE_TTL_MS=60000''',
]
